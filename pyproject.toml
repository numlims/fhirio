[build-system]
requires = ["setuptools"] # list of packages needed to build your package
build-backend = "setuptools.build_meta" # name of the python object that frontends use to perform the build

[project]
name = "fhirio"
version = "0.0.2"
authors = [
  { name="numlims", email="numlims@med.uni-greifswald.de"}
]
description = "read and write fhir resources"
readme = "readme.md"
requires-python = ">=3.8"
dependencies = [
  "dip @ git+https://github.com/numlims/dip.git",
  "natsort",
  "versionflag @ git+https://github.com/numlims/versionflag.git"  
]
classifiers = [
  "Programming Language :: Python :: 3"
]

[project.scripts]
fhirio = "fhirio:__main__"

[tool.setuptools]
packages = ["fhirio"]